<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Cortisol</title>
</head>
<body>
    <main>
          <div class="passo ativo" id="passo-0">
            <img src="fundo2.jpeg" alt="">
             <p>Você tem cortisol alto?</p>
        <button class="btn-proximo" data-proximo="1">sim</button>
        <button class="btn-proximo" data-proximo="2">não</button>
          </div>
          <div class="passo" id="passo-1">
            <p>Você quer reduzir seu cortisol?</p>
        <button class="btn-proximo" data-proximo="3">com certeza</button>
        <button class="btn-proximo" data-proximo="4">negativo</button>
          </div>
          <div class="passo" id="passo-2">
            <p>Ao tentar reduzir seu cortisol, você tem que escolher entre:</p>
            <button class="btn-proximo" data-proximo="5">Estudar(high cortisol)</button>
            <button class="btn-proximo" data-proximo="6">Dormir(low cortsisol)</button>
          </div>
    </main>
